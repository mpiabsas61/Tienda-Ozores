<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - TIENDA OZORES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-light">

    <header class="container-fluid bg-dark py-4">
    <div class="container text-white">
      <a class="navbar-brand mb-0 h1" href="index.html">TIENDA OZORES</a>
    </div>
  </header>

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="mb-4">
              <h1 class="h4 mb-1">Crear cuenta</h1>
              <p class="text-muted small mb-0">Registrate para comprar y ver tu historial.</p>
            </div>
            <div id="register-context-message" class="alert alert-info small d-none" role="status"></div>
            <form id="register-form">
              <div class="mb-3">
                <label for="register-nombre" class="form-label">Nombre (opcional)</label>
                <input type="text" class="form-control" id="register-nombre" autocomplete="given-name" />
              </div>
              <div class="mb-3">
                <label for="register-apellido" class="form-label">Apellido (opcional)</label>
                <input type="text" class="form-control" id="register-apellido" autocomplete="family-name" />
              </div>
              <div class="mb-3">
                <label for="register-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="register-email" autocomplete="email" required />
              </div>
              <div class="mb-3">
                <label for="register-password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="register-password" autocomplete="new-password"
                  required />
              </div>
              <div class="mb-3">
                <label for="register-password-confirm" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="register-password-confirm" autocomplete="new-password"
                  required />
              </div>
              <p id="register-message" class="text-danger small mb-3"></p>
              <button type="submit" class="btn btn-primary w-100">Registrarme</button>
            </form>
            <div class="mt-3 text-center">
              <a href="login.html" class="small text-decoration-none">Ya tengo cuenta, volver al login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>

</html>
