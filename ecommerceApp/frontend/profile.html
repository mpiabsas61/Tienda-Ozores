<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil - TIENDA OZORES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand mb-0 h1" href="index.html">TIENDA OZORES</a>
      <div class="d-flex gap-2 ms-auto">
        <a href="index.html" class="btn btn-outline-info btn-sm">
          <i class="bi bi-shop"></i> Volver al catálogo
        </a>
        <button id="logout-button" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="row g-4">
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3">Mi perfil</h1>
            <div class="small text-muted mb-1">Nombre</div>
            <div id="profile-name" class="fw-semibold mb-3"></div>
            <div class="small text-muted mb-1">Email</div>
            <div id="profile-email" class="fw-semibold mb-3"></div>
            <div class="small text-muted mb-1">Teléfono</div>
            <div id="profile-phone" class="fw-semibold mb-3"></div>
            <div class="small text-muted mb-1">Fecha de nacimiento</div>
            <div id="profile-birthdate" class="fw-semibold mb-3"></div>
            <div class="small text-muted mb-1">Rol</div>
            <div id="profile-role" class="fw-semibold mb-3"></div>
            <button id="profile-edit-button" type="button" class="btn btn-primary w-100" aria-expanded="false" disabled
              aria-controls="profile-edit-form">
              Editar datos
            </button>
            <div id="profile-message" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>

            <form id="profile-edit-form" class="d-none mt-4">
              <div class="mb-3">
                <label for="profile-edit-name" class="form-label">Nombre</label>
                <input id="profile-edit-name" name="nombre" type="text" class="form-control" maxlength="100" required />
              </div>
              <div class="mb-3">
                <label for="profile-edit-lastname" class="form-label">Apellido</label>
                <input id="profile-edit-lastname" name="apellido" type="text" class="form-control" maxlength="100" />
              </div>
              <div class="mb-3">
                <label for="profile-edit-email" class="form-label">Email</label>
                <input id="profile-edit-email" type="email" class="form-control" readonly />
              </div>
              <div class="mb-3">
                <label for="profile-edit-phone" class="form-label">Teléfono</label>
                <input id="profile-edit-phone" name="telefono" type="tel" class="form-control" maxlength="30" />
              </div>
              <div class="mb-3">
                <label for="profile-edit-birthdate" class="form-label">Fecha de nacimiento</label>
                <input id="profile-edit-birthdate" name="fecha_nacimiento" type="date" class="form-control" />
              </div>
              <div class="d-flex flex-column flex-sm-row gap-2">
                <button id="profile-save-button" type="submit" class="btn btn-primary flex-grow-1">Guardar cambios</button>
                <button id="profile-cancel-button" type="button" class="btn btn-outline-secondary">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
              <div>
                <h2 class="h5 mb-1">Historial de compras</h2>
                <p class="text-muted small mb-0">Órdenes registradas con su detalle.</p>
              </div>
            </div>

            <div id="orders-empty-state" class="alert alert-light border text-center d-none mb-0">
              Todavía no tenés compras registradas.
            </div>

            <div id="orders-list" class="d-grid gap-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>

</html>
