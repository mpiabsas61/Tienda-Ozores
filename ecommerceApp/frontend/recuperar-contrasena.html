<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña - TIENDA OZORES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-light">
  <header class="container-fluid bg-dark py-4">
    <div class="container text-white">
      <a class="navbar-brand mb-0 h1" href="index.html">TIENDA OZORES</a>
    </div>
  </header>

  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="mb-4">
              <h1 class="h4 mb-1">Recuperar contraseña</h1>
              <p class="text-muted small mb-0">Solicitá un código y usalo para crear una nueva contraseña.</p>
            </div>
            <div id="recovery-message" class="small mb-3" role="status" aria-live="polite"></div>
            <form id="recovery-request-form">
              <div class="mb-3">
                <label for="recovery-email" class="form-label">Email de tu cuenta</label>
                <input type="email" class="form-control" id="recovery-email" autocomplete="email" required />
              </div>
              <button id="request-recovery-button" type="submit" class="btn btn-primary w-100">
                Solicitar código
              </button>
            </form>
            <form id="recovery-reset-form" class="d-none">
              <div class="mb-3">
                <label for="recovery-code" class="form-label">Código de recuperación</label>
                <input type="text" class="form-control" id="recovery-code" inputmode="numeric" autocomplete="one-time-code"
                  minlength="8" maxlength="8" pattern="[0-9]{8}" required />
                <div class="form-text">El código vence en 10 minutos y solo puede usarse una vez.</div>
              </div>
              <div class="mb-3">
                <label for="recovery-password" class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" id="recovery-password" autocomplete="new-password"
                  minlength="8" required />
              </div>
              <div class="mb-3">
                <label for="recovery-password-confirm" class="form-label">Confirmar nueva contraseña</label>
                <input type="password" class="form-control" id="recovery-password-confirm" autocomplete="new-password"
                  minlength="8" required />
              </div>
              <button id="reset-password-button" type="submit" class="btn btn-primary w-100">
                Cambiar contraseña
              </button>
            </form>
            <div class="mt-3 text-center">
              <a href="login.html" class="small text-decoration-none">Volver al inicio de sesión</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/recovery.js"></script>
</body>

</html>
